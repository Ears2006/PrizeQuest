<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrizeQuest • Reset Password</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .login-wrapper {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
    }
    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }
    .input {
      width: 100%;
      padding: 12px 14px;
      color: #E7EEF1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(0, 255, 170, 0.28);
      border-radius: 10px;
      outline: none;
      transition: box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
    }
    .input:focus {
      border-color: rgba(0, 255, 170, 0.55);
      background: rgba(0, 255, 170, 0.03);
      box-shadow: 0 0 14px rgba(0, 255, 170, 0.25), inset 0 0 10px rgba(0, 255, 170, 0.12);
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(0, 255, 170, 0.38);
      background: linear-gradient(180deg, rgba(0, 255, 170, 0.16), rgba(0, 255, 170, 0.08));
      color: #E7EEF1;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.4px;
      transition: box-shadow 180ms ease, transform 120ms ease, border-color 180ms ease;
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.18);
    }
    .btn:hover { box-shadow: 0 0 18px rgba(0, 255, 170, 0.35); }
    .btn:active { transform: translateY(1px); }
    .actions {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="logo-ticket" aria-label="PrizeQuest neon ticket logo"></div>
    <h1>Reset your password</h1>
    <form class="form" id="resetForm" autocomplete="on">
      <input class="input" type="email" name="email" id="email" placeholder="Email address" required />
      <div class="actions">
        <button class="btn" type="submit" id="resetBtn">Reset password</button>
        <a class="btn" href="/auth/login.html" style="text-align:center;text-decoration:none;display:inline-block;">Back to login</a>
      </div>
      <p id="status" style="font-size:.9rem;opacity:.85;margin:6px 0 0;"></p>
    </form>
  </div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import {
      sendPasswordResetEmail,
    } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';

    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('email');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    const setStatus = (message = '', type = 'info') => {
      if (!statusEl) return;
      statusEl.textContent = message;
      statusEl.style.color = type === 'error' ? '#ff8a8a' : 'rgba(231,238,241,0.9)';
    };

    const isValidEmail = (value) => /\S+@\S+\.\S+/.test(value);

    const startCooldown = (durationMs) => {
      let remaining = Math.ceil(durationMs / 1000);
      const originalText = resetBtn.dataset.originalText || 'Reset password';
      resetBtn.disabled = true;
      resetBtn.textContent = `Wait ${remaining}s`;
      const intervalId = setInterval(() => {
        remaining -= 1;
        if (remaining > 0) {
          resetBtn.textContent = `Wait ${remaining}s`;
        } else {
          clearInterval(intervalId);
          resetBtn.disabled = false;
          resetBtn.textContent = originalText;
        }
      }, 1000);
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      if (!email || !isValidEmail(email)) {
        setStatus('Please enter a valid email address.', 'error');
        return;
      }

      setStatus('Sending reset email…');
      resetBtn.disabled = true;
      resetBtn.dataset.originalText = resetBtn.textContent;
      resetBtn.textContent = 'Sending…';

      try {
        await sendPasswordResetEmail(auth, email, {
          url: `${location.origin}/auth/reset.html`,
          handleCodeInApp: true,
        });
        setStatus(`If an account exists for ${email}, a reset link has been sent. Check your inbox.`);
        startCooldown(30000);
      } catch (error) {
        console.error('Password reset error:', error);
        const message = error.code === 'auth/user-not-found'
          ? 'If an account exists for this email, a reset link will be sent.'
          : (error.message || 'Could not send reset email. Please try again.');
        setStatus(message, 'error');
        resetBtn.disabled = false;
        resetBtn.textContent = resetBtn.dataset.originalText || 'Reset password';
      }
    });
  </script>
</body>
</html>
