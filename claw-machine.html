<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Claw Machine - PrizeQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      background: linear-gradient(180deg, #0a0a0f 0%, #1a1a2e 100%);
      color: #E7EEF1;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Three.js Canvas Container */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 20px;
      text-align: center;
      pointer-events: none;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: rgba(0, 255, 170, 0.95);
      text-shadow: 0 0 20px rgba(0, 255, 170, 0.6), 0 0 40px rgba(0, 255, 170, 0.3);
      text-transform: uppercase;
      letter-spacing: 3px;
      animation: titleGlow 2s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% {
        text-shadow: 0 0 20px rgba(0, 255, 170, 0.6), 0 0 40px rgba(0, 255, 170, 0.3);
      }
      50% {
        text-shadow: 0 0 30px rgba(0, 255, 170, 0.9), 0 0 60px rgba(0, 255, 170, 0.5);
      }
    }

    /* Controls Container */
    .controls-container {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 40px;
      pointer-events: none;
      z-index: 20;
    }

    /* Joystick */
    .joystick-wrapper {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .joystick-label {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(0, 255, 170, 0.9);
      text-shadow: 0 0 8px rgba(0, 255, 170, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .joystick {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(0, 255, 170, 0.15), rgba(0, 255, 170, 0.05));
      border: 3px solid rgba(0, 255, 170, 0.6);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.4), inset 0 0 20px rgba(0, 255, 170, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .joystick-stick {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(0, 255, 170, 0.9), rgba(0, 255, 170, 0.6));
      border: 2px solid rgba(0, 255, 170, 1);
      border-radius: 50%;
      position: absolute;
      cursor: grab;
      box-shadow: 0 0 20px rgba(0, 255, 170, 0.8);
      transition: transform 0.1s ease;
      touch-action: none;
    }

    .joystick-stick:active {
      cursor: grabbing;
      box-shadow: 0 0 30px rgba(0, 255, 170, 1);
    }

    /* Directional Arrows */
    .joystick-arrows {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .arrow {
      position: absolute;
      font-size: 1.2rem;
      color: rgba(0, 255, 170, 0.5);
      font-weight: 700;
    }

    .arrow.up { top: 10px; left: 50%; transform: translateX(-50%); }
    .arrow.down { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .arrow.left { left: 10px; top: 50%; transform: translateY(-50%); }
    .arrow.right { right: 10px; top: 50%; transform: translateY(-50%); }

    /* Drop Button */
    .drop-button-wrapper {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .drop-button {
      padding: 30px 60px;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(255, 50, 50, 0.3), rgba(255, 50, 50, 0.15));
      border: 4px solid rgba(255, 50, 50, 0.8);
      border-radius: 50px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 10px rgba(255, 50, 50, 0.8);
      box-shadow: 0 0 40px rgba(255, 50, 50, 0.6), inset 0 0 20px rgba(255, 50, 50, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
      animation: dropButtonPulse 2s ease-in-out infinite;
      font-family: 'Exo 2', sans-serif;
    }

    .drop-button:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(255, 50, 50, 0.5), rgba(255, 50, 50, 0.25));
      border-color: rgba(255, 50, 50, 1);
      box-shadow: 0 0 60px rgba(255, 50, 50, 0.8), inset 0 0 30px rgba(255, 50, 50, 0.3);
      transform: translateY(-4px);
    }

    .drop-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .drop-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      animation: none;
    }

    @keyframes dropButtonPulse {
      0%, 100% {
        box-shadow: 0 0 40px rgba(255, 50, 50, 0.6), inset 0 0 20px rgba(255, 50, 50, 0.2);
      }
      50% {
        box-shadow: 0 0 60px rgba(255, 50, 50, 0.9), inset 0 0 30px rgba(255, 50, 50, 0.3);
      }
    }

    /* Back Button */
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(0, 255, 170, 0.15), rgba(0, 255, 170, 0.08));
      border: 2px solid rgba(0, 255, 170, 0.6);
      border-radius: 30px;
      color: rgba(0, 255, 170, 0.95);
      text-shadow: 0 0 8px rgba(0, 255, 170, 0.5);
      box-shadow: 0 0 20px rgba(0, 255, 170, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      pointer-events: auto;
      font-family: 'Exo 2', sans-serif;
      z-index: 100;
    }

    .back-button:hover {
      background: linear-gradient(135deg, rgba(0, 255, 170, 0.25), rgba(0, 255, 170, 0.15));
      border-color: rgba(0, 255, 170, 0.9);
      box-shadow: 0 0 35px rgba(0, 255, 170, 0.5);
      transform: translateY(-2px);
    }

    /* Countdown Timer */
    .countdown-timer {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.2), rgba(255, 100, 0, 0.2));
      border: 3px solid rgba(255, 170, 0, 0.8);
      border-radius: 20px;
      padding: 20px 40px;
      font-size: 2rem;
      font-weight: 700;
      color: rgba(255, 200, 0, 0.95);
      text-shadow: 0 0 15px rgba(255, 170, 0, 0.8);
      box-shadow: 0 0 40px rgba(255, 170, 0, 0.5), inset 0 0 20px rgba(255, 170, 0, 0.2);
      text-transform: uppercase;
      letter-spacing: 2px;
      pointer-events: auto;
      z-index: 50;
      animation: timerPulse 1s ease-in-out infinite;
    }

    @keyframes timerPulse {
      0%, 100% {
        box-shadow: 0 0 40px rgba(255, 170, 0, 0.5), inset 0 0 20px rgba(255, 170, 0, 0.2);
      }
      50% {
        box-shadow: 0 0 60px rgba(255, 170, 0, 0.8), inset 0 0 30px rgba(255, 170, 0, 0.3);
      }
    }

    .countdown-timer.urgent {
      border-color: rgba(255, 50, 50, 0.9);
      color: rgba(255, 80, 80, 0.95);
      text-shadow: 0 0 15px rgba(255, 50, 50, 0.8);
      animation: timerUrgent 0.5s ease-in-out infinite;
    }

    @keyframes timerUrgent {
      0%, 100% {
        box-shadow: 0 0 40px rgba(255, 50, 50, 0.6), inset 0 0 20px rgba(255, 50, 50, 0.3);
      }
      50% {
        box-shadow: 0 0 70px rgba(255, 50, 50, 0.9), inset 0 0 35px rgba(255, 50, 50, 0.4);
      }
    }

    .countdown-label {
      font-size: 0.9rem;
      display: block;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    .countdown-time {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
    }

    /* Winner Modal */
    .winner-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 1000;
      animation: fadeIn 0.5s ease-out;
    }

    .winner-modal.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .winner-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(0, 255, 170, 0.08));
      border: 3px solid rgba(0, 255, 170, 0.6);
      border-radius: 20px;
      padding: 50px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 0 60px rgba(0, 255, 170, 0.5);
      animation: winnerCardAppear 0.6s ease-out;
    }

    @keyframes winnerCardAppear {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .winner-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: winnerIconBounce 1s ease-in-out infinite;
    }

    @keyframes winnerIconBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .winner-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: rgba(0, 255, 170, 0.95);
      text-shadow: 0 0 20px rgba(0, 255, 170, 0.6);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .winner-name {
      font-size: 1.8rem;
      font-weight: 600;
      color: rgba(231, 238, 241, 0.95);
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(0, 255, 170, 0.1);
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 170, 0.3);
    }

    .continue-button {
      padding: 16px 50px;
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(0, 255, 170, 0.3), rgba(0, 255, 170, 0.15));
      border: 3px solid rgba(0, 255, 170, 0.8);
      border-radius: 50px;
      color: rgba(0, 255, 170, 0.95);
      text-shadow: 0 0 10px rgba(0, 255, 170, 0.6);
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.4);
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Exo 2', sans-serif;
    }

    .continue-button:hover {
      background: linear-gradient(135deg, rgba(0, 255, 170, 0.4), rgba(0, 255, 170, 0.25));
      box-shadow: 0 0 50px rgba(0, 255, 170, 0.6);
      transform: translateY(-2px);
    }

    /* Particle Effects */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(0, 255, 170, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.9);
      animation: particleFall 1.5s ease-out forwards;
    }

    @keyframes particleFall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(100px) rotate(360deg) scale(0.3);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }
      
      .controls-container {
        bottom: 3%;
        gap: 20px;
        flex-direction: column;
        align-items: center;
      }

      .joystick {
        width: 140px;
        height: 140px;
      }

      .joystick-stick {
        width: 50px;
        height: 50px;
      }

      .drop-button {
        padding: 20px 40px;
        font-size: 1.5rem;
      }

      .winner-card {
        padding: 30px 20px;
        margin: 20px;
      }

      .winner-title {
        font-size: 1.8rem;
      }

      .winner-name {
        font-size: 1.3rem;
      }
    }

    /* Tablet/Medium screens */
    @media (max-width: 1024px) and (min-width: 769px) {
      .controls-container {
        bottom: 4%;
        gap: 30px;
      }

      .joystick {
        width: 160px;
        height: 160px;
      }

      .joystick-stick {
        width: 55px;
        height: 55px;
      }

      .drop-button {
        padding: 25px 50px;
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- Three.js Canvas Container -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <button class="back-button" id="backButton">← Back to Home</button>

    <!-- Countdown Timer -->
    <div class="countdown-timer" id="countdownTimer" style="display: none;">
      <span class="countdown-label">Winner Draw Begins In:</span>
      <div class="countdown-time" id="countdownTime">01:00</div>
    </div>

    <div class="header">
      <h1 id="prizeTitle">3D Claw Machine</h1>
      <p id="prizeSubtitle" style="font-size: 1.2rem; color: rgba(0, 255, 170, 0.8); margin-top: 10px; display: none;"></p>
      <div id="playerDisplay" style="font-size: 1rem; color: rgba(255, 215, 0, 0.95); margin-top: 10px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); display: none;">
        Selected Player: <strong id="playerName">--</strong>
      </div>
    </div>

    <div class="controls-container">
      <!-- Joystick Control -->
      <div class="joystick-wrapper">
        <div class="joystick-label">Position Claw</div>
        <div class="joystick" id="joystick">
          <div class="joystick-arrows">
            <div class="arrow up" title="Move Up">▲</div>
            <div class="arrow down" title="Move Down">▼</div>
            <div class="arrow left" title="Move Left">◄</div>
            <div class="arrow right" title="Move Right">►</div>
          </div>
          <div class="joystick-stick" id="joystick-stick"></div>
        </div>
      </div>

      <!-- Drop Button -->
      <div class="drop-button-wrapper">
        <button class="drop-button" id="dropButton">Drop!</button>
      </div>
    </div>
  </div>

  <!-- Winner Modal -->
  <div class="winner-modal" id="winnerModal">
    <div class="winner-card">
      <div class="winner-icon">🎉</div>
      <div class="winner-title">Winner Selected!</div>
      <div class="winner-name" id="winnerName">User12345</div>
      <button class="continue-button" id="continueButton">Continue</button>
    </div>
  </div>

  <!-- Particle Container -->
  <div class="particles" id="particles"></div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Main Game Script -->
  <script>
    // =============================================
    // THREE.JS SETUP
    // =============================================
    let scene, camera, renderer;
    let clawGroup, clawCable, clawLeft, clawRight;
    let cabinetGroup, tickets = [];
    let selectedTicket = null;

    // Claw position and movement
    let clawPosition = { x: 0, y: 3, z: 0 };
    let clawVelocity = { x: 0, y: 0 };
    const clawSpeed = 0.05;
    const clawMaxX = 2.5;
    const clawMinY = 0.5;
    const clawMaxY = 3.5;

    // Game state
    let isDropping = false;
    let isGrabbing = false;
    let isReturning = false;
    let dropButton;
    
    // Drawing state variables
    let currentPrizeType = null;
    let drawingState = null;
    let countdownInterval = null;
    let remainingTime = 0;
    let isCountdownMode = false;
    
    // Player selection variables
    let selectedPlayer = null;

    // GET URL PARAMETERS
    function getURLParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // LOAD DRAWING STATE
    function loadDrawingState() {
      currentPrizeType = getURLParameter('prize');
      if (!currentPrizeType) {
        console.log('No prize type specified, running in manual mode');
        // Enable controls immediately in manual mode
        enableManualControls();
        return;
      }

      const stored = localStorage.getItem(`drawing_${currentPrizeType}`);
      if (!stored) {
        console.warn(`No drawing state found for ${currentPrizeType}`);
        // Enable controls when no drawing state found
        enableManualControls();
        return;
      }

      try {
        drawingState = JSON.parse(stored);
        const elapsed = Date.now() - drawingState.startTime;
        remainingTime = Math.max(0, drawingState.duration - elapsed);

        if (remainingTime > 0) {
          isCountdownMode = true;
          startCountdown();
          disableManualControls();
          updatePrizeTitle();
        } else {
          // Timer already expired, trigger immediately
          triggerAutoDrop();
        }
      } catch (e) {
        console.error('Failed to load drawing state:', e);
      }
    }

    // SELECT PLAYER FOR DRAWING
    function selectPlayer() {
      const isAdminMode = localStorage.getItem('isAdminMode') === 'true';
      
      if (isAdminMode) {
        // ADMIN MODE: Admin will play the claw game
        selectedPlayer = {
          username: "EJ (Admin Test)",
          id: "admin_player"
        };
        console.log(`Admin Mode - Admin will play the claw game`);
      } else {
        // PUBLIC MODE: Select random winner name (fake for display)
        const fakeWinners = ["SkillStar22", "CodeRanger", "PrizeFanatic", "LuckyByte", "NeonQuestor", 
                             "GamerPro88", "QuestMaster", "PixelChamp", "RetroGamer", "ArcadeKing"];
        const randomIndex = Math.floor(Math.random() * fakeWinners.length);
        selectedPlayer = {
          username: fakeWinners[randomIndex],
          id: `fake_winner_${randomIndex}`
        };
        console.log(`Public Mode - Random winner selected:`, selectedPlayer.username);
      }
      
      // Display selected player
      displaySelectedPlayer();
    }
    
    // DISPLAY SELECTED PLAYER
    function displaySelectedPlayer() {
      if (selectedPlayer) {
        const playerDisplay = document.getElementById('playerDisplay');
        const playerName = document.getElementById('playerName');
        
        if (playerDisplay && playerName) {
          playerName.textContent = selectedPlayer.username;
          playerDisplay.style.display = 'block';
        }
      }
    }

    // UPDATE PRIZE TITLE
    function updatePrizeTitle() {
      if (drawingState && drawingState.prizeName) {
        document.getElementById('prizeTitle').textContent = drawingState.prizeName;
        const subtitle = document.getElementById('prizeSubtitle');
        if (subtitle) {
          subtitle.textContent = 'Winner Draw in Progress';
          subtitle.style.display = 'block';
        }
      }
      
      // Select player when drawing starts
      if (!selectedPlayer) {
        selectPlayer();
      }
    }

    // START COUNTDOWN
    function startCountdown() {
      const timerElement = document.getElementById('countdownTimer');
      const timeDisplay = document.getElementById('countdownTime');
      const isAdminMode = localStorage.getItem('isAdminMode') === 'true';
      
      if (timerElement) {
        timerElement.style.display = 'block';
      }

      updateCountdownDisplay();

      countdownInterval = setInterval(() => {
        remainingTime -= 1000;

        // Persist remaining time to prevent refresh bypass
        if (drawingState) {
          drawingState.startTime = Date.now() - (drawingState.duration - remainingTime);
          localStorage.setItem(`drawing_${currentPrizeType}`, JSON.stringify(drawingState));
        }

        if (remainingTime <= 0) {
          clearInterval(countdownInterval);
          
          // Check admin mode: if enabled, allow manual play; if disabled, auto-drop
          if (isAdminMode) {
            // Enable controls for admin to play
            enableManualControls();
            hideCountdown();
            console.log('Countdown complete - Admin Mode: Controls enabled for manual play');
          } else {
            // Auto-drop for public mode
            triggerAutoDrop();
            console.log('Countdown complete - Public Mode: Auto-dropping');
          }
        } else {
          updateCountdownDisplay();
        }
      }, 1000);
    }
    
    // HIDE COUNTDOWN
    function hideCountdown() {
      const timerElement = document.getElementById('countdownTimer');
      if (timerElement) {
        timerElement.style.display = 'none';
      }
    }

    // UPDATE COUNTDOWN DISPLAY
    function updateCountdownDisplay() {
      const timeDisplay = document.getElementById('countdownTime');
      const timerElement = document.getElementById('countdownTimer');
      
      if (!timeDisplay) return;

      const seconds = Math.ceil(remainingTime / 1000);
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      
      timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      // Add urgent styling when under 10 seconds
      if (seconds <= 10 && timerElement) {
        timerElement.classList.add('urgent');
      }
    }

    // DISABLE MANUAL CONTROLS
    function disableManualControls() {
      const joystickStick = document.getElementById('joystick-stick');
      if (joystickStick) {
        joystickStick.style.pointerEvents = 'none';
        joystickStick.style.opacity = '0.3';
      }

      if (dropButton) {
        dropButton.disabled = true;
        dropButton.style.opacity = '0.3';
      }
    }

    // ENABLE MANUAL CONTROLS
    function enableManualControls() {
      const isAdminMode = localStorage.getItem('isAdminMode') === 'true';
      
      console.log(`Enabling manual controls (Admin Mode: ${isAdminMode})`);
      
      // Enable joystick stick
      const joystickStick = document.getElementById('joystick-stick');
      if (joystickStick) {
        joystickStick.style.pointerEvents = 'auto';
        joystickStick.style.opacity = '1';
      }
      
      // Enable joystick container
      const joystickContainer = document.getElementById('joystick');
      if (joystickContainer) {
        joystickContainer.classList.remove('disabled');
        joystickContainer.style.pointerEvents = 'auto';
        joystickContainer.style.opacity = '1';
      }
      
      // Enable drop button
      if (dropButton) {
        dropButton.disabled = false;
        dropButton.style.opacity = '1';
        dropButton.style.cursor = 'pointer';
        dropButton.style.pointerEvents = 'auto';
      }
      
      // Show instruction message in admin mode
      if (isAdminMode) {
        const countdownTimer = document.getElementById('countdownTimer');
        if (countdownTimer) {
          countdownTimer.innerHTML = `
            <div style="text-align: center; padding: 20px; background: rgba(0, 255, 170, 0.1); border: 2px solid rgba(0, 255, 170, 0.3); border-radius: 12px;">
              <div style="font-size: 1.5rem; color: rgba(0, 255, 170, 0.95); margin-bottom: 10px;">
                🎮 Admin Mode Active
              </div>
              <div style="font-size: 1rem; opacity: 0.8;">
                Use joystick to position, then press DROP
              </div>
            </div>
          `;
          countdownTimer.style.display = 'block';
        }
      }
    }
    
    // TRIGGER AUTO DROP
    function triggerAutoDrop() {
      console.log('Auto-triggering claw drop for winner selection...');
      
      // Hide countdown
      const timerElement = document.getElementById('countdownTimer');
      if (timerElement) {
        timerElement.style.display = 'none';
      }

      // Simulate drop button click
      setTimeout(() => {
        if (dropButton && !isDropping && !isGrabbing && !isReturning) {
          dropButton.click();
        }
      }, 1000);
    }

    function initThreeJS() {
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);
      scene.fog = new THREE.Fog(0x0a0a0f, 10, 30);

      // Camera (Third-person view)
      camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 4, 12);
      camera.lookAt(0, 2, 0);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0x4444ff, 0.4);
      scene.add(ambientLight);

      // Purple/Blue arcade lighting
      const purpleLight = new THREE.PointLight(0x8800ff, 1.5, 20);
      purpleLight.position.set(-5, 5, 5);
      scene.add(purpleLight);

      const blueLight = new THREE.PointLight(0x00aaff, 1.5, 20);
      blueLight.position.set(5, 5, 5);
      scene.add(blueLight);

      // Main spotlight for claw machine
      const spotlight = new THREE.SpotLight(0xffffff, 2);
      spotlight.position.set(0, 8, 0);
      spotlight.castShadow = true;
      spotlight.shadow.mapSize.width = 2048;
      spotlight.shadow.mapSize.height = 2048;
      spotlight.angle = Math.PI / 4;
      spotlight.penumbra = 0.3;
      spotlight.decay = 2;
      spotlight.distance = 20;
      scene.add(spotlight);

      // Cyan accent light
      const cyanLight = new THREE.PointLight(0x00ffaa, 1, 15);
      cyanLight.position.set(0, 3, 8);
      scene.add(cyanLight);

      // Build the scene
      createCabinetMachine();
      createClaw();
      createTickets();
      createFloor();

      // Animation loop
      animate();
    }

    function createCabinetMachine() {
      cabinetGroup = new THREE.Group();

      // Cabinet base
      const baseGeometry = new THREE.BoxGeometry(6, 0.5, 6);
      const baseMaterial = new THREE.MeshStandardMaterial({
        color: 0x222222,
        metalness: 0.8,
        roughness: 0.2
      });
      const base = new THREE.Mesh(baseGeometry, baseMaterial);
      base.position.y = 0.25;
      base.castShadow = true;
      base.receiveShadow = true;
      cabinetGroup.add(base);

      // Glass walls (transparent)
      const glassGeometry = new THREE.BoxGeometry(5.8, 4, 5.8);
      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x88ccff,
        transparent: true,
        opacity: 0.15,
        metalness: 0.1,
        roughness: 0.1,
        transmission: 0.9,
        thickness: 0.5,
        envMapIntensity: 1
      });
      const glassWalls = new THREE.Mesh(glassGeometry, glassMaterial);
      glassWalls.position.y = 2.5;
      cabinetGroup.add(glassWalls);

      // Cabinet frame (metallic edges)
      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffaa,
        metalness: 0.9,
        roughness: 0.1,
        emissive: 0x00ffaa,
        emissiveIntensity: 0.3
      });

      // Vertical frame posts
      const postGeometry = new THREE.BoxGeometry(0.2, 4.5, 0.2);
      const positions = [
        [-2.9, 2.75, -2.9],
        [2.9, 2.75, -2.9],
        [-2.9, 2.75, 2.9],
        [2.9, 2.75, 2.9]
      ];

      positions.forEach(pos => {
        const post = new THREE.Mesh(postGeometry, frameMaterial);
        post.position.set(...pos);
        post.castShadow = true;
        cabinetGroup.add(post);
      });

      // Top frame
      const topGeometry = new THREE.BoxGeometry(6, 0.3, 6);
      const top = new THREE.Mesh(topGeometry, frameMaterial);
      top.position.y = 5;
      top.castShadow = true;
      cabinetGroup.add(top);

      scene.add(cabinetGroup);
    }

    function createClaw() {
      clawGroup = new THREE.Group();

      // Cable (from top)
      const cableGeometry = new THREE.CylinderGeometry(0.05, 0.05, 2, 8);
      const cableMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffaa,
        metalness: 0.9,
        roughness: 0.2,
        emissive: 0x00ffaa,
        emissiveIntensity: 0.4
      });
      clawCable = new THREE.Mesh(cableGeometry, cableMaterial);
      clawCable.position.y = 1;
      clawCable.castShadow = true;
      clawGroup.add(clawCable);

      // Claw arms
      const armMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffaa,
        metalness: 0.95,
        roughness: 0.1,
        emissive: 0x00ffaa,
        emissiveIntensity: 0.5
      });

      // Left claw arm
      const leftArmGeometry = new THREE.ConeGeometry(0.15, 0.8, 3);
      clawLeft = new THREE.Mesh(leftArmGeometry, armMaterial);
      clawLeft.rotation.z = Math.PI;
      clawLeft.position.set(-0.25, -0.2, 0);
      clawLeft.castShadow = true;
      clawGroup.add(clawLeft);

      // Right claw arm
      const rightArmGeometry = new THREE.ConeGeometry(0.15, 0.8, 3);
      clawRight = new THREE.Mesh(rightArmGeometry, armMaterial);
      clawRight.rotation.z = Math.PI;
      clawRight.position.set(0.25, -0.2, 0);
      clawRight.castShadow = true;
      clawGroup.add(clawRight);

      // Claw center hub
      const hubGeometry = new THREE.SphereGeometry(0.2, 16, 16);
      const hub = new THREE.Mesh(hubGeometry, armMaterial);
      hub.castShadow = true;
      clawGroup.add(hub);

      // Position claw
      clawGroup.position.set(clawPosition.x, clawPosition.y, clawPosition.z);
      scene.add(clawGroup);
    }

    function createTickets() {
      const ticketMaterial = new THREE.MeshStandardMaterial({
        color: 0xffaa00,
        metalness: 0.3,
        roughness: 0.4,
        emissive: 0xffaa00,
        emissiveIntensity: 0.2
      });

      const ticketGeometry = new THREE.BoxGeometry(0.5, 0.05, 0.3);

      // Create pool of tickets
      for (let i = 0; i < 30; i++) {
        const ticket = new THREE.Mesh(ticketGeometry, ticketMaterial);
        
        // Random position within cabinet
        const x = (Math.random() - 0.5) * 4.5;
        const z = (Math.random() - 0.5) * 4.5;
        const y = 0.6 + Math.random() * 0.3;
        
        ticket.position.set(x, y, z);
        ticket.rotation.y = Math.random() * Math.PI * 2;
        ticket.castShadow = true;
        ticket.receiveShadow = true;
        
        tickets.push(ticket);
        scene.add(ticket);
      }
    }

    function createFloor() {
      const floorGeometry = new THREE.PlaneGeometry(30, 30);
      const floorMaterial = new THREE.MeshStandardMaterial({
        color: 0x111122,
        metalness: 0.2,
        roughness: 0.8
      });
      const floor = new THREE.Mesh(floorGeometry, floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      floor.receiveShadow = true;
      scene.add(floor);
    }

    function updateClawPosition() {
      if (isDropping || isGrabbing || isReturning) return;

      // Apply velocity to position (X and Y only, Z stays at 0)
      clawPosition.x += clawVelocity.x;
      clawPosition.y += clawVelocity.y;
      clawPosition.z = 0; // Keep claw centered on Z axis

      // Clamp positions to visible boundaries
      clawPosition.x = Math.max(-clawMaxX, Math.min(clawMaxX, clawPosition.x));
      clawPosition.y = Math.max(clawMinY, Math.min(clawMaxY, clawPosition.y));

      // Update Three.js position
      clawGroup.position.set(clawPosition.x, clawPosition.y, clawPosition.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateClawPosition();
      renderer.render(scene, camera);
    }

    // =============================================
    // JOYSTICK CONTROLS
    // =============================================
    const joystickContainer = document.getElementById('joystick');
    const joystickStick = document.getElementById('joystick-stick');
    let isDragging = false;
    let joystickCenter = { x: 0, y: 0 };
    const joystickRadius = 60; // max distance from center

    function initJoystick() {
      const rect = joystickContainer.getBoundingClientRect();
      joystickCenter.x = rect.left + rect.width / 2;
      joystickCenter.y = rect.top + rect.height / 2;
    }

    joystickStick.addEventListener('mousedown', startDrag);
    joystickStick.addEventListener('touchstart', startDrag);

    function startDrag(e) {
      isDragging = true;
      e.preventDefault();
      initJoystick();
    }

    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', drag);

    function drag(e) {
      if (!isDragging) return;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let dx = clientX - joystickCenter.x;
      let dy = clientY - joystickCenter.y;

      const distance = Math.sqrt(dx * dx + dy * dy);
      
      // Limit to joystick radius
      if (distance > joystickRadius) {
        dx = (dx / distance) * joystickRadius;
        dy = (dy / distance) * joystickRadius;
      }

      // Update stick visual position
      joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;

      // Map to claw velocity
      // X axis: left/right (joystick left/right)
      // Y axis: up/down (joystick forward/backward)
      // Note: Inverted Y because screen Y increases downward but claw Y increases upward
      clawVelocity.x = (dx / joystickRadius) * clawSpeed;
      clawVelocity.y = (-dy / joystickRadius) * clawSpeed;
    }

    window.addEventListener('mouseup', stopDrag);
    window.addEventListener('touchend', stopDrag);

    function stopDrag() {
      if (!isDragging) return;
      isDragging = false;
      
      // Reset stick position
      joystickStick.style.transform = 'translate(0, 0)';
      
      // Stop claw movement
      clawVelocity.x = 0;
      clawVelocity.y = 0;
    }

    // Additional keyboard controls (still available as an alternative)
    window.addEventListener('keydown', (e) => {
      if (isDropping || isGrabbing || isReturning) return;

      if (e.key === 'ArrowLeft' || e.key === 'a') {
        clawVelocity.x = -clawSpeed;
      }
      if (e.key === 'ArrowRight' || e.key === 'd') {
        clawVelocity.x = clawSpeed;
      }
      if (e.key === 'ArrowUp' || e.key === 'w') {
        clawVelocity.y = clawSpeed;
      }
      if (e.key === 'ArrowDown' || e.key === 's') {
        clawVelocity.y = -clawSpeed;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ArrowRight' || e.key === 'd') {
        clawVelocity.x = 0;
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'ArrowDown' || e.key === 's') {
        clawVelocity.y = 0;
      }
    });

    // =============================================
    // DROP MECHANISM
    // =============================================
    dropButton = document.getElementById('dropButton');

    dropButton.addEventListener('click', () => {
      if (isDropping || isGrabbing || isReturning) return;
      
      dropButton.disabled = true;
      isDropping = true;

      // Animate claw descending
      const dropInterval = setInterval(() => {
        clawPosition.y -= 0.08;
        clawGroup.position.y = clawPosition.y;

        if (clawPosition.y <= clawMinY) {
          clearInterval(dropInterval);
          isDropping = false;
          grabTicket();
        }
      }, 16);
    });

    function grabTicket() {
      isGrabbing = true;

      // Close claw arms animation
      let closeProgress = 0;
      const closeInterval = setInterval(() => {
        closeProgress += 0.05;
        const angle = closeProgress * (Math.PI / 6);
        clawLeft.rotation.z = Math.PI + angle;
        clawRight.rotation.z = Math.PI - angle;

        if (closeProgress >= 1) {
          clearInterval(closeInterval);
          
          // Select random ticket
          selectedTicket = tickets[Math.floor(Math.random() * tickets.length)];
          
          // Attach ticket to claw visually
          selectedTicket.position.set(
            clawPosition.x,
            clawPosition.y - 0.4,
            clawPosition.z
          );
          
          // Add glow to selected ticket
          selectedTicket.material.emissiveIntensity = 0.8;
          
          isGrabbing = false;
          returnToTop();
        }
      }, 16);
    }

    function returnToTop() {
      isReturning = true;

      const returnInterval = setInterval(() => {
        clawPosition.y += 0.08;
        clawGroup.position.y = clawPosition.y;

        // Move ticket with claw
        if (selectedTicket) {
          selectedTicket.position.y = clawPosition.y - 0.4;
        }

        if (clawPosition.y >= clawMaxY) {
          clearInterval(returnInterval);
          isReturning = false;
          
          // Particle effects
          createParticleEffect();
          
          // Show winner modal
          setTimeout(() => {
            showWinnerModal();
          }, 500);
        }
      }, 16);
    }

    function createParticleEffect() {
      const particlesContainer = document.getElementById('particles');
      
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Random position around center
        const angle = (Math.PI * 2 * i) / 20;
        const radius = 50 + Math.random() * 100;
        const x = window.innerWidth / 2 + Math.cos(angle) * radius;
        const y = window.innerHeight / 2 + Math.sin(angle) * radius;
        
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.animationDelay = (i * 0.05) + 's';
        
        particlesContainer.appendChild(particle);
        
        setTimeout(() => {
          particle.remove();
        }, 1500);
      }
    }

    function showWinnerModal() {
      const modal = document.getElementById('winnerModal');
      const winnerName = document.getElementById('winnerName');
      
      // Use the selected player (set during countdown start)
      const winnerUsername = selectedPlayer ? selectedPlayer.username : "EJ (Admin Test)";
      
      // TESTING MODE: Player is always "EJ (Admin Test)" (set in selectPlayer function)
      // FUTURE: Random winner selection (commented in selectPlayer function)
      
      // Display winner with prize info if available
      if (currentPrizeInfo && currentPrizeInfo.name) {
        winnerName.innerHTML = `<strong>${winnerUsername}</strong><br><span style="font-size: 1.2rem; opacity: 0.8;">wins ${currentPrizeInfo.name}!</span>`;
      } else {
        winnerName.textContent = winnerUsername;
      }
      
      modal.classList.add('active');
      
      // KEEP drawing state - don't clear it after winner selection
      // This allows admin to re-view the claw machine until they reset the raffle
      // The drawing state will only be cleared when admin clicks "Reset Raffle Cycle"
      
      // OLD BEHAVIOR (cleared immediately):
      // if (isCountdownMode && currentPrizeType) {
      //   localStorage.removeItem(`drawing_${currentPrizeType}`);
      //   console.log(`Drawing completed for ${currentPrizeType}, state cleared`);
      // }
      
      console.log(`Winner: ${winnerUsername} for ${currentPrizeType}. Drawing state preserved until admin reset.`);
    }

    // =============================================
    // RESET RAFFLE AFTER WINNER DRAWN
    // =============================================
    function clearPrizeAndReturn() {
      // Clear the prize info from localStorage
      localStorage.removeItem("currentPrize");
      
      // If there was prize info, also reset that raffle's entries to 0
      if (currentPrizeInfo && currentPrizeInfo.type) {
        const raffleState = localStorage.getItem("raffleState");
        if (raffleState) {
          try {
            const raffles = JSON.parse(raffleState);
            if (raffles[currentPrizeInfo.type]) {
              // Reset entries, adCount, and surveyCount to 0 for new raffle cycle
              raffles[currentPrizeInfo.type].entries = 0;
              raffles[currentPrizeInfo.type].adCount = 0;
              raffles[currentPrizeInfo.type].surveyCount = 0;
              localStorage.setItem("raffleState", JSON.stringify(raffles));
              console.log(`Reset ${currentPrizeInfo.type} raffle to 0 (entries, ads, surveys)`);
            }
          } catch (e) {
            console.error("Failed to reset raffle state:", e);
          }
        }
      }
      
      // Return to home
      window.location.href = 'index.html';
    }

    // =============================================
    // INITIAL SETUP
    // =============================================
    // Check if controls should be disabled initially based on admin mode
    function checkInitialControlState() {
      const isAdminMode = localStorage.getItem('isAdminMode') === 'true';
      
      if (!isAdminMode) {
        // Public mode: Disable controls immediately (auto-drop will happen)
        const joystickContainer = document.getElementById('joystick');
        if (joystickContainer) {
          joystickContainer.classList.add('disabled');
          joystickContainer.style.pointerEvents = 'none';
          joystickContainer.style.opacity = '0.5';
        }
        
        const joystickStick = document.getElementById('joystick-stick');
        if (joystickStick) {
          joystickStick.style.pointerEvents = 'none';
          joystickStick.style.opacity = '0.3';
        }
        
        const dropBtn = document.querySelector('#dropButton');
        if (dropBtn) {
          dropBtn.disabled = true;
          dropBtn.style.opacity = '0.5';
          dropBtn.style.cursor = 'not-allowed';
          dropBtn.style.pointerEvents = 'none';
        }
        console.log('Public Mode - Controls disabled, waiting for auto-drop');
      } else {
        // Admin mode: Controls will be enabled after countdown
        console.log('Admin Mode - Controls will be enabled after countdown');
      }
    }
    
    // =============================================
    // UI BUTTONS
    // =============================================
    document.getElementById('backButton').addEventListener('click', () => {
      clearPrizeAndReturn();
    });

    document.getElementById('continueButton').addEventListener('click', () => {
      clearPrizeAndReturn();
    });

    // =============================================
    // WINDOW RESIZE
    // =============================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      if (!isDragging) {
        initJoystick();
      }
    });

    // =============================================
    // PRIZE INFO FROM LOCALSTORAGE
    // =============================================
    let currentPrizeInfo = null;

    function loadPrizeInfo() {
      const prizeData = localStorage.getItem("currentPrize");
      if (prizeData) {
        try {
          currentPrizeInfo = JSON.parse(prizeData);
          console.log("Prize info loaded:", currentPrizeInfo);
          
          // Update header with prize name
          const prizeTitle = document.getElementById('prizeTitle');
          const prizeSubtitle = document.getElementById('prizeSubtitle');
          
          if (prizeTitle && currentPrizeInfo.name) {
            prizeTitle.textContent = 'Drawing Winner';
            prizeSubtitle.textContent = `Prize: ${currentPrizeInfo.name} (${currentPrizeInfo.totalEntries} entries)`;
            prizeSubtitle.style.display = 'block';
          }
        } catch (e) {
          console.error("Failed to parse prize info:", e);
        }
      } else {
        console.log("No prize info found - running in demo mode");
      }
    }

    // =============================================
    // INITIALIZE
    // =============================================
    window.addEventListener('DOMContentLoaded', () => {
      loadPrizeInfo();
      initThreeJS();
      initJoystick();
      loadDrawingState(); // Load drawing state and start countdown if applicable
      // After loading drawing state, check if we need to disable controls for public mode
      if (!isCountdownMode && !currentPrizeType) {
        // Manual mode - controls already enabled by loadDrawingState
      } else if (isCountdownMode) {
        // Countdown mode - controls already disabled by loadDrawingState
      } else {
        // No drawing state found with prize type - check admin mode
        checkInitialControlState();
      }
    });
  </script>
</body>
