<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Access - PrizeQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0B1117;
      color: #E7EEF1;
      font-family: 'Exo 2', sans-serif;
    }

    .admin-access-wrapper {
      width: min(400px, 90vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
    }

    .logo-ticket {
      width: 120px;
      height: 72px;
      border-radius: 12px;
      background: rgba(0, 255, 170, 0.06);
      border: 1px solid rgba(0, 255, 170, 0.45);
      box-shadow: 0 0 18px rgba(0, 255, 170, 0.35), inset 0 0 28px rgba(0, 255, 170, 0.12);
      position: relative;
    }

    /* ticket cutouts */
    .logo-ticket::before,
    .logo-ticket::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 28px;
      background: #0B1117;
      border: 1px solid rgba(0, 255, 170, 0.3);
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.25);
    }

    .logo-ticket::before { left: -10px; border-right: none; border-radius: 8px 0 0 8px; }
    .logo-ticket::after  { right: -10px; border-left: none;  border-radius: 0 8px 8px 0; }

    h1 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: rgba(0, 255, 170, 0.95);
      text-shadow: 0 0 15px rgba(0, 255, 170, 0.5);
    }

    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      color: #E7EEF1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(0, 255, 170, 0.28);
      border-radius: 10px;
      outline: none;
      box-shadow: inset 0 0 0 rgba(0, 255, 170, 0), 0 0 0 rgba(0, 255, 170, 0);
      transition: box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
      font-family: 'Exo 2', sans-serif;
      font-size: 1rem;
    }

    .input::placeholder {
      color: rgba(231, 238, 241, 0.6);
    }

    .input:focus {
      border-color: rgba(0, 255, 170, 0.55);
      background: rgba(0, 255, 170, 0.03);
      box-shadow: 0 0 14px rgba(0, 255, 170, 0.25), inset 0 0 10px rgba(0, 255, 170, 0.12);
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      margin-top: 6px;
      border: 1px solid rgba(0, 255, 170, 0.38);
      background: linear-gradient(180deg, rgba(0, 255, 170, 0.16), rgba(0, 255, 170, 0.08));
      color: #E7EEF1;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.4px;
      transition: box-shadow 180ms ease, transform 120ms ease, border-color 180ms ease;
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.18);
      font-family: 'Exo 2', sans-serif;
      font-size: 1rem;
    }

    .btn:hover {
      box-shadow: 0 0 18px rgba(0, 255, 170, 0.35);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: linear-gradient(180deg, rgba(231, 238, 241, 0.1), rgba(231, 238, 241, 0.05));
      border-color: rgba(231, 238, 241, 0.3);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      box-shadow: 0 0 18px rgba(231, 238, 241, 0.25);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="admin-access-wrapper">
    <div class="logo-ticket" aria-label="PrizeQuest neon ticket logo"></div>
    <h1>Admin Access</h1>
    <form class="form" id="adminAccessForm" autocomplete="on">
      <input 
        class="input" 
        type="text" 
        name="username" 
        id="username"
        placeholder="Username" 
        required 
        autocomplete="username"
      />
      <input 
        class="input" 
        type="password" 
        name="password" 
        id="password"
        placeholder="Password" 
        required 
        autocomplete="current-password"
      />
      <div class="button-group">
        <button type="submit" class="btn" id="loginBtn">Login</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Home</button>
      </div>
    </form>
  </div>

  <script type="module">
    // Admin access form handler
    const form = document.getElementById('adminAccessForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');

    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = (usernameInput?.value || '').trim();
        const password = (passwordInput?.value || '').trim();
        
        if (!username || !password) {
          alert('Please enter both username and password.');
          return;
        }

        try {
          if (loginBtn) loginBtn.disabled = true;

          // Admin authentication logic would go here
          // For now, redirect to admin dashboard after validation
          // This maintains the existing admin routing/permissions logic
          
          // Store admin session (if needed by existing logic)
          sessionStorage.setItem('adminAuthenticated', 'true');
          
          // Redirect to admin dashboard
          window.location.href = '/admin.html';
        } catch (error) {
          console.error('Admin login error:', error);
          alert('Invalid credentials. Please try again.');
          if (loginBtn) loginBtn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
